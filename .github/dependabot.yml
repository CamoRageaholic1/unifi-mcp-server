# Dependabot: daily checks. Minor and patch updates are grouped into one PR per
# package type; major updates get their own PRs. Added 2026-10-14.

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: daily
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: daily
    groups:
      docker-compose-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
